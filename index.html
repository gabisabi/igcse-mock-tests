<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Grade 9 IGCSE revision: notes, flashcards and quizzes for every class.">
<title>IGCSE Mock Tests and Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233A4FD6'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='28' fill='white' text-anchor='middle'%3EIX%3C/text%3E%3C/svg%3E">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Georgian:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F2F4F8; --surface:#FFFFFF; --surface2:#E9EDF4; --line:#D7DDE8;
  --ink:#151C2A; --muted:#5B6678; --faint:#8B95A8;
  --accent:#3A4FD6; --accent-ink:#FFFFFF; --accent-soft:#E4E8FB;
  --know:#1F9A63; --know-soft:#DDF4E8; --again:#D9503A; --again-soft:#FBE3DE; --warn:#C98A12; --warn-soft:#FBEFD4;
  --mark:#FFF1A8;
  --shadow:0 1px 2px rgba(21,28,42,.06),0 8px 24px -12px rgba(21,28,42,.18);
  --display:"Sora","Noto Sans","Noto Sans Georgian",system-ui,sans-serif;
  --body:"Noto Sans","Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F141E; --surface:#161D2B; --surface2:#1F2837; --line:#2B3547;
    --ink:#E9EDF5; --muted:#A0AABC; --faint:#6F7A8F;
    --accent:#8090FF; --accent-ink:#0F141E; --accent-soft:#232B4D;
    --know:#3FCB8A; --know-soft:#153627; --again:#FF7A62; --again-soft:#43221C; --warn:#F0B542; --warn-soft:#3D2E10;
    --mark:#5A4E12;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F141E; --surface:#161D2B; --surface2:#1F2837; --line:#2B3547;
  --ink:#E9EDF5; --muted:#A0AABC; --faint:#6F7A8F;
  --accent:#8090FF; --accent-ink:#0F141E; --accent-soft:#232B4D;
  --know:#3FCB8A; --know-soft:#153627; --again:#FF7A62; --again-soft:#43221C; --warn:#F0B542; --warn-soft:#3D2E10;
  --mark:#5A4E12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
:lang(ka){font-family:"Noto Sans Georgian","Noto Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-inline:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px}
.brand h1{font-size:16px;font-weight:600}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--body)}
.side .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 8px 4px;font-weight:600}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;color:var(--ink)}
.navbtn:hover{background:var(--surface2)}
.navbtn.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navbtn .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:13px;color:#fff;flex:none}
.navbtn .nm{flex:1;min-width:0}
.navbtn .nm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn .nm small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn .pct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
/* main */
.main{padding-block:22px 60px;padding-inline:clamp(16px,4vw,44px);min-width:0}
.topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.search input{flex:1;border:0;background:none;color:inherit;font:inherit;min-width:0}
.search input::placeholder{color:var(--faint)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.status{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.status.ok i{background:var(--know)}
.status.bad i{background:var(--again)}
.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.hero h2{font-size:clamp(22px,3vw,30px);font-weight:600}
.hero p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card .head{display:flex;align-items:center;gap:10px}
.card .dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700}
.card h3{font-size:15px;font-weight:600}
.card .teacher{font-size:12px;color:var(--muted)}
.card .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar b.k{background:var(--know)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.crumb button{color:var(--accent);font-weight:500}
.crumb .sep{color:var(--faint)}
/* topic list */
.topics{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.trow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left}
.trow:hover{border-color:var(--accent)}
.trow h3{font-size:15px;font-weight:600}
.trow .sub{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);font-weight:500}
.tag.exam{background:var(--warn-soft);color:var(--warn)}
.tag.ka{background:var(--accent-soft);color:var(--accent)}
.ring{width:42px;height:42px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--surface2)}
.ring .fg{stroke:var(--know);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
/* topic page */
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;width:max-content;max-width:100%;margin:14px 0 18px}
.tabs button{padding:7px 16px;border-radius:9px;font-weight:500;color:var(--muted);font-size:14px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs button small{color:var(--faint);font-weight:400;margin-left:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,32px);max-width:860px}
.notes{max-width:70ch;font-size:15.5px}
.notes h1{font-size:24px;margin:0 0 14px}
.notes h2{font-size:19px;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.notes h3{font-size:16px;margin:20px 0 8px}
.notes p{margin:0 0 12px}
.notes ul,.notes ol{margin:0 0 12px;padding-left:22px}
.notes li{margin:3px 0}
.notes blockquote{margin:0 0 12px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.notes blockquote p:last-child{margin:0}
.notes code{font-family:var(--mono);font-size:.9em;background:var(--surface2);padding:1px 5px;border-radius:4px}
.notes pre{background:var(--surface2);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:0 0 12px}
.notes pre code{background:none;padding:0}
.notes mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}
.notes .tw{overflow-x:auto;margin:0 0 12px}
.notes table{border-collapse:collapse;min-width:50%;font-size:14px}
.notes th,.notes td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.notes th{background:var(--surface2);font-weight:600}
.notes hr{border:0;border-top:1px solid var(--line);margin:20px 0}
/* flashcards */
.fc-wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.fc-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap;gap:8px}
.fc{perspective:1200px;min-height:260px}
.fc .inner{position:relative;width:100%;min-height:260px;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .inner{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:19px;line-height:1.45;overflow:auto}
.fc .face.back{transform:rotateY(180deg);background:var(--surface);border-color:var(--accent)}
.fc .face small{position:absolute;top:12px;left:16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.fc-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.know{background:var(--know-soft);color:var(--know);border-color:transparent}
.btn.again{background:var(--again-soft);color:var(--again);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.fc .face .hint{position:absolute;bottom:12px;left:0;right:0;font-size:11px;color:var(--faint)}
.qa{display:flex;flex-direction:column;gap:8px}
.qa-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:14px;text-align:left}
.qa-row.know{border-color:var(--know)}
.qa-row.learn{border-color:var(--again)}
.qa-q{font-weight:600}
.qa-a{color:var(--muted)}
.qa-row p{margin:0}
@media (max-width:600px){.qa-row{grid-template-columns:1fr;gap:4px}}
/* bilingual notes */
.panel.wide{max-width:1240px}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.bi .notes{max-width:none;font-size:14.5px}
.bi .en{border-left:1px solid var(--line);padding-left:28px}
.bi-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:10px}
@media (max-width:900px){.bi{grid-template-columns:1fr}.bi .en{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:18px}}
/* accounts */
.auth{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:860px}
.auth .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.auth h3{font-size:16px;margin-bottom:12px}
.auth form{display:flex;flex-direction:column;gap:10px}
.auth input{font:inherit;color:inherit;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.auth label{font-size:12px;color:var(--muted);font-weight:500}
.auth .err{color:var(--again);font-size:13px;min-height:18px}
.acct{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;max-width:860px;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);background:var(--surface2)}
.tbl tr[data-student]{cursor:pointer}
.tbl tr[data-student]:hover td{background:var(--accent-soft)}
.tbl td.n{font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
@media (max-width:700px){.auth{grid-template-columns:1fr}}
/* to-do */
.todo-form{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;margin-bottom:14px}
.todo-form input,.todo-form select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.todos{display:flex;flex-direction:column;gap:8px}
.todo{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.todo.done .tt{opacity:.5;text-decoration:line-through}
.todo .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--know);flex:none}
.todo.done .chk{background:var(--know-soft);border-color:var(--know)}
.todo .sub{font-size:12px;color:var(--muted);display:flex;gap:10px;margin-top:2px;flex-wrap:wrap}
.todo .late{color:var(--again);font-weight:600}
.todo .del{color:var(--faint);font-size:22px;padding:0 6px;line-height:1}
.todo .del:hover{color:var(--again)}
.h3{margin:26px 0 10px;font-size:15px}
@media (max-width:600px){.todo-form{grid-template-columns:1fr 1fr}.todo-form #todo-text{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){.fc .inner,.card,.bar b{transition:none}}
/* quiz */
.qz{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.qz .qn{font-size:12px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.qz .qt{font-size:18px;font-weight:600;font-family:var(--display)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.opt:hover{border-color:var(--accent)}
.opt .k{width:24px;height:24px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.opt.right{background:var(--know-soft);border-color:var(--know)}
.opt.wrong{background:var(--again-soft);border-color:var(--again)}
.opt:disabled{cursor:default}
.explain{padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.score{text-align:center;padding:20px}
.score .big{font-family:var(--display);font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}
.score p{color:var(--muted)}
.results{display:flex;flex-direction:column;gap:8px}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:left}
.hit .p{font-size:12px;color:var(--muted)}
.hit .s{font-size:13px;color:var(--muted);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hit mark{background:var(--mark);color:inherit}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:99px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.foot{margin-top:28px;font-size:12px;color:var(--faint)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-block:10px;padding-inline:16px;align-items:center}
  .side .label{display:none}
  #nav-subjects{display:flex;gap:6px;flex:none}
  .brand{padding:0 8px 0 0;flex:none}
  .brand h1,.brand small{display:none}
  .navbtn{width:auto;padding:6px 10px 6px 6px;border:1px solid var(--line);border-radius:999px;flex:none}
  .navbtn .nm small,.navbtn .pct{display:none}
  .navbtn .dot{width:24px;height:24px;font-size:11px}
  .fc .face{font-size:17px;padding:22px}
}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo">IX</div><div><h1>IGCSE Mock Tests and Notes</h1><small>Grade 9 · IGCSE</small></div></div>
    <button class="navbtn active" id="nav-home" data-nav="home"><span class="dot" style="background:var(--accent)">⌂</span><span class="nm"><span>All subjects</span></span></button>
    <button class="navbtn" id="nav-todo" data-nav="todo"><span class="dot" style="background:var(--warn)">✓</span><span class="nm"><span>To-do</span></span><span class="pct" id="todo-count"></span></button>
    <button class="navbtn" id="nav-students" data-nav="students" hidden><span class="dot" style="background:var(--again)">★</span><span class="nm"><span>Students</span><small>Admin only</small></span></button>
    <button class="navbtn" id="nav-account" data-nav="account"><span class="dot" style="background:var(--muted)">☺</span><span class="nm"><span id="account-label">Sign in</span><small id="account-sub">Save progress to an account</small></span></button>
    <div class="label">Classes</div>
    <div id="nav-subjects"></div>
  </aside>
  <main class="main" id="main">
    <div class="topbar">
      <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search notes, flashcards, questions…" autocomplete="off"></label>
      <div id="exam-chips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
      <span class="status" id="status"><i></i><span>Connecting…</span></span>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const S={subjects:[],topics:[],progress:{cards:{},quiz:{},seen:{}},view:'home',subject:null,topic:null,tab:'notes',exam:'all',q:'',db:null,uid:null,pdoc:null,ready:false,fc:{i:0,flip:false,order:[],onlyLearn:false},qz:{i:0,picked:null,score:0,done:false,answers:[]}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#5B6CF0','#E0553A','#1F9A63','#C98A12','#8A4FD3','#0F8FA8','#D33C7A','#4A6B2B','#B85C1A','#3B6EA5'];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
function setStatus(cls,msg){const e=$('#status');e.className='status '+cls;e.querySelector('span').textContent=msg;}

/* ---------- markdown ---------- */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/==([^=]+)==/g,'<mark>$1</mark>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(src){
  const lines=String(src||'').replace(/\r/g,'').split('\n');let out=[],i=0;
  const para=[];const flush=()=>{if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para.length=0;}};
  while(i<lines.length){
    let l=lines[i];
    if(/^```/.test(l)){flush();let b=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){b.push(lines[i]);i++;}i++;out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue;}
    if(/^\s*$/.test(l)){flush();i++;continue;}
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)/))){flush();const n=m[1].length;out.push(`<h${n}>${inline(m[2])}</h${n}>`);i++;continue;}
    if(/^(-{3,}|\*{3,})\s*$/.test(l)){flush();out.push('<hr>');i++;continue;}
    if(/^\|/.test(l)){flush();let rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++;}
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let h='<div class="tw"><table>';rows.forEach((r,k)=>{if(/^\|\s*:?-+/.test(r))return;const cs=cells(r);const tag=k===0?'th':'td';h+='<tr>'+cs.map(c=>`<${tag}>${inline(c)}</${tag}>`).join('')+'</tr>';});out.push(h+'</table></div>');continue;}
    if(/^>\s?/.test(l)){flush();let b=[];while(i<lines.length&&/^>\s?/.test(lines[i])){b.push(lines[i].replace(/^>\s?/,''));i++;}out.push('<blockquote>'+md(b.join('\n'))+'</blockquote>');continue;}
    if(/^\s*[-*•]\s+/.test(l)){flush();let h='<ul>';while(i<lines.length&&/^\s*[-*•]\s+/.test(lines[i])){h+='<li>'+inline(lines[i].replace(/^\s*[-*•]\s+/,''))+'</li>';i++;}out.push(h+'</ul>');continue;}
    if(/^\s*\d+[.)]\s+/.test(l)){flush();let h='<ol>';while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){h+='<li>'+inline(lines[i].replace(/^\s*\d+[.)]\s+/,''))+'</li>';i++;}out.push(h+'</ol>');continue;}
    para.push(l);i++;
  }
  flush();return out.join('\n');
}

/* ---------- progress ---------- */
function loadLocal(){try{const j=localStorage.getItem('rd-progress');if(j)S.progress=Object.assign({cards:{},quiz:{},seen:{},todos:[]},JSON.parse(j));}catch(e){}}
function saveLocal(){try{localStorage.setItem('rd-progress',JSON.stringify(S.progress));}catch(e){}}
let saveT=null,saving=Promise.resolve();
function saveProgress(){
  saveLocal();
  pushProgress();
  if(!S.pdoc)return;
  clearTimeout(saveT);
  saveT=setTimeout(()=>{saving=saving.then(()=>S.pdoc.set(JSON.parse(JSON.stringify(S.progress)))).catch(e=>{console.warn('progress save',e);});},600);
}
function cardStates(t){return S.progress.cards[t.id]||{};}
function knownCount(t){const st=cardStates(t);return (t.cards||[]).filter((c,i)=>st[i]==='know').length;}
function quizBest(t){return (S.progress.quiz[t.id]||{}).best??null;}
function topicMastery(t){
  const parts=[];
  if((t.cards||[]).length)parts.push(knownCount(t)/t.cards.length);
  if((t.quiz||[]).length){const b=quizBest(t);parts.push(b==null?0:b/100);}
  if(!parts.length)return S.progress.seen[t.id]?1:0;
  return parts.reduce((a,b)=>a+b,0)/parts.length;
}
function subjectTopics(id){return S.topics.filter(t=>t.subject===id&&(S.exam==='all'||(t.exam||'')===S.exam)).sort((a,b)=>(a.order??99)-(b.order??99)||a.title.localeCompare(b.title));}
function subjectMastery(id){const ts=S.topics.filter(t=>t.subject===id);if(!ts.length)return 0;return ts.reduce((a,t)=>a+topicMastery(t),0)/ts.length;}
const subj=id=>S.subjects.find(s=>s.id===id);
const initial=s=>(s.short||s.name||'?').trim().charAt(0).toUpperCase();
const color=(s,i)=>s.color||COLORS[i%COLORS.length];

/* ---------- render ---------- */
function ring(p){const r=17,c=2*Math.PI*r;return `<div class="ring"><svg viewBox="0 0 42 42"><circle class="bg" cx="21" cy="21" r="${r}"></circle><circle class="fg" cx="21" cy="21" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"></circle></svg><span>${Math.round(p*100)}</span></div>`;}
function renderNav(){
  const sorted=[...S.subjects].sort((a,b)=>(a.order??99)-(b.order??99));
  $('#nav-subjects').innerHTML=sorted.map((s,i)=>`<button class="navbtn ${S.view!=='home'&&S.subject===s.id?'active':''}" data-subject="${esc(s.id)}" ${s.lang==='ka'?'lang="ka"':''}><span class="dot" style="background:${color(s,i)}">${esc(initial(s))}</span><span class="nm"><span>${esc(s.name)}</span>${s.teacher?`<small>${esc(s.teacher)}</small>`:''}</span><span class="pct">${Math.round(subjectMastery(s.id)*100)}%</span></button>`).join('');
  $('#nav-home').classList.toggle('active',S.view==='home');
  $('#nav-todo').classList.toggle('active',S.view==='todo');
  $('#nav-account').classList.toggle('active',S.view==='account');
  $('#nav-students').classList.toggle('active',S.view==='students');
  $('#nav-students').hidden=!isAdmin();
  const open=(S.progress.todos||[]).filter(t=>!t.done).length;$('#todo-count').textContent=open?open+' open':'';
  const exams=[...new Set(S.topics.map(t=>t.exam).filter(Boolean))].sort();
  $('#exam-chips').innerHTML=exams.length?[`<button class="chip ${S.exam==='all'?'on':''}" data-exam="all">Everything</button>`,...exams.map(e=>`<button class="chip ${S.exam===e?'on':''}" data-exam="${esc(e)}">${esc(e)}</button>`)].join(''):'';
}
function render(){
  renderNav();
  const v=$('#view');
  if(S.q.trim())return v.innerHTML=renderSearch();
  if(S.view==='home')v.innerHTML=renderHome();
  else if(S.view==='todo')v.innerHTML=renderTodo();
  else if(S.view==='account')v.innerHTML=renderAccount();
  else if(S.view==='students')v.innerHTML=renderStudents();
  else if(S.view==='subject')v.innerHTML=renderSubject();
  else if(S.view==='topic')v.innerHTML=renderTopic();
  window.scrollTo({top:0});
}
function renderHome(){
  const sorted=[...S.subjects].sort((a,b)=>(a.order??99)-(b.order??99));
  const total=S.topics.length,cards=S.topics.reduce((a,t)=>a+(t.cards||[]).length,0),qs=S.topics.reduce((a,t)=>a+(t.quiz||[]).length,0);
  const overall=sorted.length?sorted.reduce((a,s)=>a+subjectMastery(s.id),0)/sorted.length:0;
  let h=`<div class="hero"><div><h2>Everything for the next exam, in one place.</h2><p>Pick a class, read the notes, flip the flashcards, then take the quiz. Your progress is saved automatically.</p></div>${ring(overall)}</div>`;
  if(!S.ready&&!S.subjects.length)return h+`<div class="empty">Loading your notes…</div>`;
  if(!sorted.length)return h+`<div class="empty">No subjects yet. Send Claude photos of your notes or textbook and they will show up here.</div>`;
  h+=`<div class="grid">`+sorted.map((s,i)=>{const ts=S.topics.filter(t=>t.subject===s.id);const m=subjectMastery(s.id);
    return `<button class="card" data-subject="${esc(s.id)}" ${s.lang==='ka'?'lang="ka"':''}><div class="head"><span class="dot" style="background:${color(s,i)}">${esc(initial(s))}</span><div><h3>${esc(s.name)}</h3><div class="teacher">${esc(s.teacher||'')}</div></div></div><div class="meta"><span>${ts.length} topic${ts.length===1?'':'s'}</span><span>${Math.round(m*100)}% mastered</span></div><div class="bar"><b class="${m>=.8?'k':''}" style="width:${Math.round(m*100)}%"></b></div></button>`;}).join('')+`</div>`;
  h+=`<p class="foot">${total} topics · ${cards} flashcards · ${qs} quiz questions</p>`;
  return h;
}
function renderSubject(){
  const s=subj(S.subject);if(!s)return `<div class="empty">Subject not found.</div>`;
  const ts=subjectTopics(s.id);const ka=s.lang==='ka';
  let h=`<div class="crumb"><button data-nav="home">All subjects</button><span class="sep">›</span><span>${esc(s.name)}</span></div>`;
  h+=`<div class="hero" ${ka?'lang="ka"':''}><div><h2>${esc(s.name)}</h2><p>${esc(s.teacher?s.teacher+' · ':'')}${ts.length} topic${ts.length===1?'':'s'}${s.note?' · '+esc(s.note):''}</p></div>${ring(subjectMastery(s.id))}</div>`;
  if(!ts.length)return h+`<div class="empty">${ka?'ამ საგანში ჯერ ჩანაწერები არ არის. გამოუგზავნე Claude-ს სახელმძღვანელოს ან რვეულის ფოტოები.':'No notes for this class yet. Send Claude photos of your book or notebook pages and they will appear here.'}</div>`;
  h+=`<div class="topics" ${ka?'lang="ka"':''}>`+ts.map(t=>{const kc=(t.cards||[]).length,qc=(t.quiz||[]).length,b=quizBest(t);
    return `<button class="trow" data-topic="${esc(t.id)}"><div><h3>${esc(t.title)}</h3><div class="sub">${t.exam?`<span class="tag exam">${esc(t.exam)}</span>`:''}${kc?`<span>${knownCount(t)}/${kc} cards known</span>`:''}${qc?`<span>quiz best ${b==null?'—':b+'%'}</span>`:''}${t.updated?`<span>${esc(t.updated)}</span>`:''}</div></div>${ring(topicMastery(t))}</button>`;}).join('')+`</div>`;
  return h;
}
function renderTopic(){
  const t=S.topics.find(x=>x.id===S.topic);if(!t)return `<div class="empty">Topic not found.</div>`;
  const s=subj(t.subject)||{};const ka=s.lang==='ka'||t.lang==='ka';
  const nc=(t.cards||[]).length,nq=(t.quiz||[]).length;
  let h=`<div class="crumb"><button data-nav="home">All subjects</button><span class="sep">›</span><button data-subject="${esc(s.id||'')}">${esc(s.name||'')}</button><span class="sep">›</span><span ${ka?'lang="ka"':''}>${esc(t.title)}</span></div>`;
  h+=`<div class="hero" ${ka?'lang="ka"':''}><div><h2>${esc(t.title)}</h2><p>${t.exam?`<span class="tag exam">${esc(t.exam)}</span> `:''}${t.source?esc(t.source):''}</p></div>${ring(topicMastery(t))}</div>`;
  h+=`<div class="tabs" role="tablist"><button class="${S.tab==='notes'?'on':''}" data-tab="notes">${ka?'ჩანაწერები':'Notes'}</button><button class="${S.tab==='cards'?'on':''}" data-tab="cards" ${nc?'':'disabled'}>${ka?'ბარათები':'Flashcards'}<small>${nc}</small></button><button class="${S.tab==='quiz'?'on':''}" data-tab="quiz" ${nq?'':'disabled'}>${ka?'ტესტი':'Quiz'}<small>${nq}</small></button></div>`;
  const bi=S.tab==='notes'&&t.notesEn;
  h+=`<div class="panel ${bi?'wide':''}" ${ka?'lang="ka"':''}>`;
  if(bi)h+=`<div class="bi"><div class="notes" lang="${esc(t.lang||'ru')}"><div class="bi-label">${esc(t.lang==='ka'?'ქართულად':'По-русски · original')}</div>${md(t.notes)}</div><div class="notes en" lang="en"><div class="bi-label">In English</div>${md(t.notesEn)}</div></div>`;
  else if(S.tab==='notes')h+=`<div class="notes">${t.notes?md(t.notes):'<p style="color:var(--muted)">No notes yet for this topic.</p>'}</div>`;
  else if(S.tab==='cards')h+=renderCards(t);
  else h+=renderQuiz(t);
  return h+`</div>`;
}
function fcOrder(t){const st=cardStates(t);let idx=t.cards.map((c,i)=>i);if(S.fc.onlyLearn){const f=idx.filter(i=>st[i]!=='know');if(f.length)idx=f;}return idx;}
function renderCards(t){
  const st=cardStates(t);const order=S.fc.order.length?S.fc.order:fcOrder(t);S.fc.order=order;
  if(S.fc.i>=order.length)S.fc.i=0;
  const known=knownCount(t);
  const top=`<div class="fc-top"><span>${S.fc.list?`${t.cards.length} cards`:`Card ${S.fc.i+1} of ${order.length}`} · <b style="color:var(--know)">${known}</b>/${t.cards.length} known</span><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm ${S.fc.list?'primary':''}" data-fc="list">${S.fc.list?'Back to cards':'All answers'}</button><button class="btn sm ${S.fc.onlyLearn?'primary':''}" data-fc="learn">Only still learning</button><button class="btn sm" data-fc="shuffle">Shuffle</button><button class="btn sm" data-fc="reset">Reset</button></span></div>
  <div class="bar"><b class="k" style="width:${Math.round(known/t.cards.length*100)}%"></b></div>`;
  if(S.fc.list)return `<div class="fc-wrap">${top}<div class="qa">${t.cards.map((c,i)=>`<div class="qa-row ${st[i]||''}"><div class="qa-q">${i+1}. ${md(c.q)}</div><div class="qa-a">${md(c.a)}</div></div>`).join('')}</div></div>`;
  const ci=order[S.fc.i];const c=t.cards[ci];const state=st[ci];
  return `<div class="fc-wrap">${top}
  <button class="fc ${S.fc.flip?'flip':''}" data-fc="flip" aria-label="Flip card"><div class="inner"><div class="face front"><small>Question${state?' · '+(state==='know'?'known':'learning'):''}</small><div>${md(c.q)}</div><span class="hint">Tap the card or press Show answer</span></div><div class="face back"><small>Answer</small><div>${md(c.a)}</div><span class="hint">Tap to go back to the question</span></div></div></button>
  <div class="fc-actions"><button class="btn primary" data-fc="flip">${S.fc.flip?'Show question':'Show answer'}</button></div>
  <div class="fc-actions"><button class="btn" data-fc="prev">‹ Back</button><button class="btn again" data-fc="again">Still learning</button><button class="btn know" data-fc="know">Got it ✓</button><button class="btn" data-fc="next">Next ›</button></div></div>`;
}
function renderQuiz(t){
  const q=S.qz;const qs=t.quiz;
  if(q.done){const pct=Math.round(q.score/qs.length*100);const best=quizBest(t);
    return `<div class="qz"><div class="score"><div class="big">${pct}%</div><p>${q.score} of ${qs.length} correct${best!=null?` · best ${best}%`:''}</p><button class="btn primary" data-qz="restart">Try again</button></div><div class="results">${qs.map((x,i)=>`<div class="hit"><div class="p">${q.answers[i]===x.answer?'✓':'✗'} Q${i+1}</div><div>${inline(x.q)}</div><div class="s">${inline(x.options[x.answer])}${x.explain?' — '+inline(x.explain):''}</div></div>`).join('')}</div></div>`;}
  const x=qs[q.i];const picked=q.picked;
  return `<div class="qz"><div class="bar"><b style="width:${Math.round(q.i/qs.length*100)}%"></b></div><div class="qn">Question ${q.i+1} of ${qs.length}</div><div class="qt">${inline(x.q)}</div><div class="opts">${x.options.map((o,k)=>{let cls='opt';if(picked!=null){if(k===x.answer)cls+=' right';else if(k===picked)cls+=' wrong';}return `<button class="${cls}" data-opt="${k}" ${picked!=null?'disabled':''}><span class="k">${String.fromCharCode(65+k)}</span><span>${inline(o)}</span></button>`;}).join('')}</div>${picked!=null?`<div class="explain">${picked===x.answer?'<b>Correct.</b> ':'<b>Not quite.</b> '}${x.explain?inline(x.explain):''}</div><div style="text-align:right"><button class="btn primary" data-qz="next">${q.i+1<qs.length?'Next question ›':'See score'}</button></div>`:''}</div>`;
}
function renderSearch(){
  const q=S.q.trim().toLowerCase();const hits=[];
  const hl=s=>esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
  for(const t of S.topics){const s=subj(t.subject)||{};const p=(s.name||'')+' › '+t.title;
    if(t.title.toLowerCase().includes(q))hits.push({t,p,s:t.notes?t.notes.slice(0,140):'' ,tab:'notes'});
    const ni=(t.notes||'').toLowerCase().indexOf(q);if(ni>=0)hits.push({t,p,s:(t.notes||'').slice(Math.max(0,ni-60),ni+100),tab:'notes'});
    (t.cards||[]).forEach(c=>{if((c.q+' '+c.a).toLowerCase().includes(q))hits.push({t,p,s:c.q+' → '+c.a,tab:'cards'});});
    (t.quiz||[]).forEach(c=>{if(c.q.toLowerCase().includes(q))hits.push({t,p,s:c.q,tab:'quiz'});});
  }
  if(!hits.length)return `<div class="empty">Nothing found for “${esc(S.q)}”.</div>`;
  return `<div class="results">${hits.slice(0,40).map(h=>`<button class="hit" data-topic="${esc(h.t.id)}" data-gotab="${h.tab}"><div class="p">${esc(h.p)} · ${h.tab}</div><div class="s">${hl(h.s.replace(/[#*`>|]/g,''))}</div></button>`).join('')}</div>`;
}

function renderTodo(){
  const todos=S.progress.todos||[];
  const sorted=[...todos].sort((a,b)=>(a.done-b.done)||((a.due||'9999')<(b.due||'9999')?-1:1));
  const today=new Date().toISOString().slice(0,10);
  const subjOpts=[...S.subjects].sort((a,b)=>(a.order??99)-(b.order??99)).map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  let h=`<div class="hero"><div><h2>To-do</h2><p>Homework, revision and deadlines in one list. Tick things off as you go.</p></div></div>`;
  h+=`<form class="todo-form" id="todo-form"><input id="todo-text" placeholder="What do you need to do? e.g. Chemistry worksheet p.12" required autocomplete="off"><select id="todo-subject" aria-label="Class"><option value="">Any class</option>${subjOpts}</select><input id="todo-due" type="date" aria-label="Due date"><button class="btn primary" type="submit">Add</button></form>`;
  h+=`<div class="todos">`+(sorted.length?sorted.map(t=>{const s=subj(t.subject);const late=!t.done&&t.due&&t.due<today;
    return `<div class="todo ${t.done?'done':''}"><button class="chk" data-todo="toggle" data-id="${esc(t.id)}" aria-label="Mark done">${t.done?'✓':''}</button><div class="tt"><div>${esc(t.text)}</div><div class="sub">${s?`<span class="tag" style="color:${esc(s.color||'')}">${esc(s.name)}</span>`:''}${t.due?`<span class="${late?'late':''}">${late?'Overdue · ':'Due '}${esc(t.due)}</span>`:''}</div></div><button class="del" data-todo="del" data-id="${esc(t.id)}" aria-label="Delete">×</button></div>`;}).join(''):`<div class="empty">Nothing here yet. Add homework above, or pick from the suggestions below.</div>`)+`</div>`;
  const weak=S.topics.filter(t=>topicMastery(t)<0.8).sort((a,b)=>topicMastery(a)-topicMastery(b)).slice(0,8);
  if(weak.length)h+=`<h3 class="h3">Suggested revision · weakest topics first</h3><div class="topics">`+weak.map(t=>{const s=subj(t.subject)||{};return `<button class="trow" data-topic="${esc(t.id)}" ${s.lang==='ka'?'lang="ka"':''}><div><h3>${esc(t.title)}</h3><div class="sub"><span>${esc(s.name||'')}</span>${t.exam?`<span class="tag exam">${esc(t.exam)}</span>`:''}</div></div>${ring(topicMastery(t))}</button>`;}).join('')+`</div>`;
  return h;
}

/* ---------- actions ---------- */
function go(view,extra={}){Object.assign(S,{view},extra);S.q='';$('#q').value='';S.fc={i:0,flip:false,order:[],onlyLearn:false};S.qz={i:0,picked:null,score:0,done:false,answers:[]};
  if(view==='topic'){S.progress.seen[S.topic]=true;saveProgress();}
  try{history.replaceState(null,'','#'+(view==='home'?'':view==='subject'?S.subject:S.topic));}catch(e){}
  render();}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-nav],[data-subject],[data-topic],[data-tab],[data-exam],[data-fc],[data-qz],[data-opt],[data-todo]');if(!b)return;
  const d=b.dataset;
  if(d.nav==='home')return go('home');
  if(d.nav==='todo')return go('todo');
  if(d.nav==='account')return go('account');
  if(d.nav==='students')return go('students',{studentId:null});
  if(d.authTab){S.authTab=d.authTab;return render();}
  if(d.auth==='out'){FB.auth.signOut().then(()=>{toast('Signed out');go('home');});return;}
  if(d.student!=null){S.studentId=d.student;return render();}
  if(d.students==='back'){S.studentId=null;return render();}
  if(d.students==='refresh'){S.students=null;return render();}
  if(d.todo){const L=S.progress.todos||[];const i=L.findIndex(x=>x.id===d.id);if(i>=0){if(d.todo==='toggle')L[i].done=!L[i].done;else L.splice(i,1);S.progress.todos=L;saveProgress();render();}return;}
  if(d.subject!=null&&!d.topic)return go('subject',{subject:d.subject});
  if(d.topic!=null){const t=S.topics.find(x=>x.id===d.topic);return go('topic',{topic:d.topic,subject:t?t.subject:S.subject,tab:d.gotab||'notes'});}
  if(d.exam){S.exam=d.exam;S.fc.order=[];return render();}
  if(d.tab){S.tab=d.tab;S.fc.flip=false;return render();}
  const t=S.topics.find(x=>x.id===S.topic);
  if(d.fc&&t){const f=S.fc;const ci=f.order[f.i];
    if(d.fc==='flip')f.flip=!f.flip;
    else if(d.fc==='next'){f.i=(f.i+1)%f.order.length;f.flip=false;}
    else if(d.fc==='prev'){f.i=(f.i-1+f.order.length)%f.order.length;f.flip=false;}
    else if(d.fc==='know'||d.fc==='again'){S.progress.cards[t.id]=S.progress.cards[t.id]||{};S.progress.cards[t.id][ci]=d.fc==='know'?'know':'learn';saveProgress();
      if(f.onlyLearn){f.order=fcOrder(t);if(f.i>=f.order.length)f.i=0;}else{f.i=(f.i+1)%f.order.length;}f.flip=false;
      if(d.fc==='know'&&knownCount(t)===t.cards.length)toast('All cards known 🎉');}
    else if(d.fc==='shuffle'){f.order=fcOrder(t).sort(()=>Math.random()-.5);f.i=0;f.flip=false;}
    else if(d.fc==='learn'){f.onlyLearn=!f.onlyLearn;f.order=fcOrder(t);f.i=0;f.flip=false;}
    else if(d.fc==='list'){f.list=!f.list;f.flip=false;}
    else if(d.fc==='reset'){delete S.progress.cards[t.id];saveProgress();f.order=fcOrder(t);f.i=0;f.flip=false;toast('Card progress reset');}
    return render();}
  if(d.opt!=null&&t){const q=S.qz;if(q.picked!=null)return;q.picked=+d.opt;q.answers[q.i]=q.picked;if(q.picked===t.quiz[q.i].answer)q.score++;return render();}
  if(d.qz&&t){const q=S.qz;
    if(d.qz==='restart'){S.qz={i:0,picked:null,score:0,done:false,answers:[]};}
    else if(d.qz==='next'){if(q.i+1<t.quiz.length){q.i++;q.picked=null;}else{q.done=true;const pct=Math.round(q.score/t.quiz.length*100);const rec=S.progress.quiz[t.id]||{best:0,attempts:0};rec.attempts++;rec.last=pct;rec.best=Math.max(rec.best||0,pct);S.progress.quiz[t.id]=rec;saveProgress();if(pct===100)toast('Perfect score!');}}
    return render();}
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;render();});
document.addEventListener('submit',async e=>{
  if(e.target.id==='signin-form'||e.target.id==='signup-form'){e.preventDefault();const err=$('#auth-err');err.textContent='';const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;
    try{if(e.target.id==='signin-form')await signIn($('#si-id').value,$('#si-pw').value);
      else{if($('#su-pw').value!==$('#su-pw2').value)throw new Error('The two passwords do not match');await signUp($('#su-user').value,$('#su-email').value,$('#su-pw').value);}
      toast('Welcome!');go('home');}
    catch(ex){err.textContent=authError(ex);}
    finally{btn.disabled=false;}
    return;}
  if(e.target.id!=='todo-form')return;e.preventDefault();const text=$('#todo-text').value.trim();if(!text)return;
  S.progress.todos=S.progress.todos||[];S.progress.todos.push({id:Date.now().toString(36),text,subject:$('#todo-subject').value,due:$('#todo-due').value,done:false});saveProgress();render();toast('Added to your list');});
document.addEventListener('keydown',e=>{if(S.view!=='topic'||S.tab!=='cards'||e.target.tagName==='INPUT')return;
  const map={' ':'flip','ArrowRight':'next','ArrowLeft':'prev','1':'again','2':'know'};if(map[e.key]){e.preventDefault();document.querySelector(`[data-fc="${map[e.key]}"]`)?.click();}});

/* ---------- accounts (Firebase) ---------- */
const FB={auth:null,db:null,user:null,profile:null,enabled:false};
const ADMIN_EMAILS=(window.ADMIN_EMAILS||[]).map(e=>String(e).toLowerCase());
function isAdmin(){return !!(FB.user&&ADMIN_EMAILS.includes((FB.user.email||'').toLowerCase()));}
function tsFn(){return firebase.firestore.FieldValue.serverTimestamp();}
function initFirebase(){
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||!window.firebase){renderAccountNav();return;}
  try{firebase.initializeApp(cfg);FB.auth=firebase.auth();FB.db=firebase.firestore();FB.enabled=true;}catch(e){console.warn('firebase init',e);renderAccountNav();return;}
  FB.auth.onAuthStateChanged(async u=>{FB.user=u;
    if(u){try{const ref=FB.db.collection('users').doc(u.uid);const snap=await ref.get();const d=snap.exists?snap.data():{};FB.profile=d;
        if(d.progress){S.progress=mergeProgress(S.progress,d.progress);saveLocal();}
        await ref.set({username:d.username||u.displayName||'',email:u.email||'',lastSeen:tsFn()},{merge:true});
        pushProgress();
        setStatus('ok','Signed in as '+(d.username||u.email)+' · progress synced');
      }catch(e){console.warn('profile',e);setStatus('bad','Signed in, but could not load your progress');}}
    else{FB.profile=null;S.students=null;setStatus('ok','Not signed in · progress saved in this browser only');}
    renderAccountNav();render();});
}
function renderAccountNav(){const l=$('#account-label'),s=$('#account-sub');if(!FB.enabled){l.textContent='Account';s.textContent='Not set up yet';return;}
  if(FB.user){l.textContent=(FB.profile&&FB.profile.username)||FB.user.displayName||FB.user.email;s.textContent=isAdmin()?'Admin · synced':'Progress synced';}else{l.textContent='Sign in';s.textContent='Save progress to an account';}}
function mergeProgress(local,remote){
  const out={cards:Object.assign({},local.cards||{}),quiz:Object.assign({},local.quiz||{},remote.quiz||{}),seen:Object.assign({},local.seen||{},remote.seen||{}),todos:(remote.todos&&remote.todos.length)?remote.todos:(local.todos||[])};
  for(const k in (remote.cards||{}))out.cards[k]=Object.assign({},(local.cards||{})[k]||{},remote.cards[k]);
  return out;
}
function withProgress(p,fn){const saved=S.progress;S.progress=p||{cards:{},quiz:{},seen:{}};try{return fn();}finally{S.progress=saved;}}
function progressSummary(p){return withProgress(p,()=>{const ts=S.topics;const m=ts.length?ts.reduce((a,t)=>a+topicMastery(t),0)/ts.length:0;
  return {mastery:Math.round(m*100),cardsKnown:ts.reduce((a,t)=>a+knownCount(t),0),quizAttempts:Object.values(p.quiz||{}).reduce((a,q)=>a+(q.attempts||0),0),topicsSeen:Object.keys(p.seen||{}).length};});}
let pushT=null;
function pushProgress(){if(!FB.enabled||!FB.user)return;clearTimeout(pushT);pushT=setTimeout(()=>{
  FB.db.collection('users').doc(FB.user.uid).set({progress:JSON.parse(JSON.stringify(S.progress)),summary:progressSummary(S.progress),updatedAt:tsFn()},{merge:true}).catch(e=>console.warn('sync',e));},800);}
async function signUp(username,email,pw){
  username=username.trim();const key=username.toLowerCase();email=email.trim();
  if(!/^[a-z0-9_.]{3,20}$/.test(key))throw new Error('Username must be 3–20 characters: letters, numbers, _ or .');
  if(pw.length<6)throw new Error('Password must be at least 6 characters');
  const taken=await FB.db.collection('usernames').doc(key).get();if(taken.exists)throw new Error('That username is already taken');
  const cred=await FB.auth.createUserWithEmailAndPassword(email,pw);
  await cred.user.updateProfile({displayName:username});
  await FB.db.collection('users').doc(cred.user.uid).set({username,email,createdAt:tsFn(),progress:JSON.parse(JSON.stringify(S.progress)),summary:progressSummary(S.progress)},{merge:true});
  await FB.db.collection('usernames').doc(key).set({uid:cred.user.uid,email});
  FB.profile={username,email};
}
async function signIn(id,pw){id=id.trim();let email=id;
  if(!id.includes('@')){const s=await FB.db.collection('usernames').doc(id.toLowerCase()).get();if(!s.exists)throw new Error('No account with that username');email=s.data().email;}
  await FB.auth.signInWithEmailAndPassword(email,pw);}
function authError(e){const c=e&&e.code||'';
  if(c==='auth/wrong-password'||c==='auth/invalid-credential'||c==='auth/invalid-login-credentials')return 'Wrong password (or wrong email).';
  if(c==='auth/user-not-found')return 'No account with that email.';
  if(c==='auth/email-already-in-use')return 'That email already has an account. Sign in instead.';
  if(c==='auth/invalid-email')return 'That email address does not look right.';
  if(c==='auth/weak-password')return 'Password must be at least 6 characters.';
  if(c==='auth/too-many-requests')return 'Too many attempts. Wait a minute and try again.';
  if(c==='permission-denied')return 'Permission denied. The Firestore rules may not be set up yet.';
  return (e&&e.message)||'Something went wrong.';}
function renderAccount(){
  if(!FB.enabled)return `<div class="hero"><div><h2>Account</h2><p>Accounts are not switched on for this site yet. Your progress is still saved in this browser.</p></div></div><div class="empty">Once the Firebase project is connected (see the README in the repo), this page becomes the sign-in and sign-up page.</div>`;
  if(FB.user){const p=FB.profile||{};const sm=progressSummary(S.progress);
    return `<div class="hero"><div><h2>${esc(p.username||FB.user.displayName||'Your account')}</h2><p>${esc(FB.user.email||'')}${isAdmin()?' · <span class="tag" style="color:var(--again)">Admin</span>':''}</p></div>${ring(sm.mastery/100)}</div>
    <div class="acct"><div class="stats"><div class="stat"><b>${sm.mastery}%</b><span>Overall mastery</span></div><div class="stat"><b>${sm.cardsKnown}</b><span>Flashcards known</span></div><div class="stat"><b>${sm.quizAttempts}</b><span>Quizzes taken</span></div><div class="stat"><b>${sm.topicsSeen}</b><span>Topics opened</span></div></div>
    <p style="margin:0;color:var(--muted);font-size:13px">Your progress is saved to your account and follows you to any device. Only you${isAdmin()?'':' (and the site admin)'} can see it.</p>
    <div><button class="btn" data-auth="out">Sign out</button></div></div>`;}
  const tab=S.authTab||'in';
  return `<div class="hero"><div><h2>Your account</h2><p>Sign in to save your flashcards, quiz scores and to-do list across every device. Nobody else can see your progress.</p></div></div>
  <div class="tabs"><button class="${tab==='in'?'on':''}" data-auth-tab="in">Sign in</button><button class="${tab==='up'?'on':''}" data-auth-tab="up">Create account</button></div>
  <div class="auth"><div class="box">${tab==='in'?`<h3>Sign in</h3><form id="signin-form"><label for="si-id">Email or username</label><input id="si-id" autocomplete="username" required><label for="si-pw">Password</label><input id="si-pw" type="password" autocomplete="current-password" required><div class="err" id="auth-err"></div><button class="btn primary" type="submit">Sign in</button></form>`
  :`<h3>Create account</h3><form id="signup-form"><label for="su-user">Username</label><input id="su-user" autocomplete="username" placeholder="e.g. beka_9b" required><label for="su-email">Email</label><input id="su-email" type="email" autocomplete="email" required><label for="su-pw">Password (6+ characters)</label><input id="su-pw" type="password" autocomplete="new-password" required minlength="6"><label for="su-pw2">Repeat password</label><input id="su-pw2" type="password" autocomplete="new-password" required><div class="err" id="auth-err"></div><button class="btn primary" type="submit">Create account</button></form>`}</div>
  <div class="box"><h3>How it works</h3><p style="margin:0 0 10px;font-size:14px;color:var(--muted)">Anything you've already done in this browser is kept and copied to your account the first time you sign in.</p><ul style="margin:0;padding-left:18px;font-size:14px;color:var(--muted)"><li>Flashcards you've marked known</li><li>Quiz scores and best results</li><li>Your to-do list</li></ul></div></div>`;
}
async function loadStudents(){try{const snap=await FB.db.collection('users').get();S.students=snap.docs.map(d=>({id:d.id,...d.data()}));}catch(e){console.warn(e);S.students=[];S.studentsErr=authError(e);}render();}
function fmtDate(ts){try{const d=ts&&ts.toDate?ts.toDate():null;return d?d.toLocaleString():'—';}catch(e){return '—';}}
function renderStudents(){
  if(!isAdmin())return `<div class="empty">This page is for the site admin only.</div>`;
  if(!S.students){loadStudents();return `<div class="hero"><div><h2>Students</h2></div></div><div class="empty">Loading…</div>`;}
  const list=[...S.students].sort((a,b)=>(a.username||'').localeCompare(b.username||''));
  if(S.studentId){const u=list.find(x=>x.id===S.studentId);if(!u)return `<div class="empty">Student not found.</div>`;const p=u.progress||{cards:{},quiz:{},seen:{}};const sm=progressSummary(p);
    const subs=[...S.subjects].sort((a,b)=>(a.order??99)-(b.order??99));
    return `<div class="crumb"><button data-students="back">Students</button><span class="sep">›</span><span>${esc(u.username||u.email||u.id)}</span></div>
    <div class="hero"><div><h2>${esc(u.username||'(no username)')}</h2><p>${esc(u.email||'')} · last active ${esc(fmtDate(u.updatedAt||u.lastSeen))}</p></div>${ring(sm.mastery/100)}</div>
    <div class="stats" style="max-width:860px;margin-bottom:18px"><div class="stat"><b>${sm.mastery}%</b><span>Overall mastery</span></div><div class="stat"><b>${sm.cardsKnown}</b><span>Flashcards known</span></div><div class="stat"><b>${sm.quizAttempts}</b><span>Quizzes taken</span></div><div class="stat"><b>${sm.topicsSeen}</b><span>Topics opened</span></div></div>
    ${withProgress(p,()=>subs.map(s=>{const ts=S.topics.filter(t=>t.subject===s.id).sort((a,b)=>(a.order??99)-(b.order??99));if(!ts.length)return '';
      return `<h3 class="h3" ${s.lang==='ka'?'lang="ka"':''}>${esc(s.name)} · ${Math.round(subjectMastery(s.id)*100)}%</h3><div class="tw"><table class="tbl"><tr><th>Topic</th><th>Cards known</th><th>Quiz best</th><th>Attempts</th><th>Mastery</th></tr>${ts.map(t=>{const q=(S.progress.quiz||{})[t.id]||{};return `<tr ${s.lang==='ka'?'lang="ka"':''}><td>${esc(t.title)}</td><td class="n">${knownCount(t)}/${(t.cards||[]).length}</td><td class="n">${q.best!=null?q.best+'%':'—'}</td><td class="n">${q.attempts||0}</td><td class="n">${Math.round(topicMastery(t)*100)}%</td></tr>`;}).join('')}</table></div>`;}).join(''))}`;}
  let h=`<div class="hero"><div><h2>Students</h2><p>${list.length} account${list.length===1?'':'s'}. Click a row for the full breakdown.</p></div><button class="btn sm" data-students="refresh">Refresh</button></div>`;
  if(S.studentsErr)h+=`<div class="empty">${esc(S.studentsErr)}</div>`;
  if(!list.length)return h+`<div class="empty">No accounts yet.</div>`;
  h+=`<div class="tw"><table class="tbl"><tr><th>Username</th><th>Email</th><th>Mastery</th><th>Cards known</th><th>Quizzes</th><th>Last active</th></tr>${list.map(u=>{const sm=u.summary||{};return `<tr data-student="${esc(u.id)}"><td><b>${esc(u.username||'—')}</b></td><td>${esc(u.email||'')}</td><td class="n">${sm.mastery??0}%</td><td class="n">${sm.cardsKnown??0}</td><td class="n">${sm.quizAttempts??0}</td><td>${esc(fmtDate(u.updatedAt||u.lastSeen))}</td></tr>`;}).join('')}</table></div>`;
  return h;
}

/* ---------- boot ---------- */
loadLocal();
function applyHash(){const h=(location.hash||'').slice(1);if(!h)return;if(S.subjects.some(s=>s.id===h)){S.view='subject';S.subject=h;}else{const t=S.topics.find(x=>x.id===h);if(t){S.view='topic';S.topic=t.id;S.subject=t.subject;}}}
render();
let hashApplied=false;
async function boot(){
  try{
    const v='?v='+Date.now();
    const [subs,tops]=await Promise.all([fetch('data/subjects.json'+v).then(r=>r.json()),fetch('data/topics.json'+v).then(r=>r.json())]);
    S.subjects=subs;S.topics=tops;S.ready=true;
    setStatus('ok','Progress saved in this browser');
    if(!hashApplied){hashApplied=true;applyHash();}
    render();
    initFirebase();
  }catch(e){S.ready=true;setStatus('bad','Could not load notes · check your connection');console.warn(e);render();}
}
boot();
})();
</script>
